<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <radialGradient id="bg" cx="30%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#f0dca0"/>
      <stop offset="100%" stop-color="#eab6c8"/>
    </radialGradient>
    <linearGradient id="bottle1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e59bb8"/>
      <stop offset="100%" stop-color="#c9557f"/>
    </linearGradient>
    <linearGradient id="bottle2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7e3c4"/>
      <stop offset="100%" stop-color="#c9a24b"/>
    </linearGradient>
    <linearGradient id="bottle3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2c9d6"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#3a2c30" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="480" fill="url(#bg)"/>

  <circle cx="520" cy="90" r="70" fill="#ffffff" opacity="0.25"/>
  <circle cx="90" cy="400" r="110" fill="#ffffff" opacity="0.18"/>

  <!-- press-on nail shapes scattered -->
  <g opacity="0.9">
    <path d="M470 330 q10 -40 40 -40 q30 0 40 40 q4 34 -40 46 q-44 -12 -40 -46 Z" fill="#f7d9e3"/>
    <path d="M110 120 q8 -32 32 -32 q24 0 32 32 q3 28 -32 38 q-35 -10 -32 -38 Z" fill="#ffffff"/>
  </g>

  <!-- bottle 1: rose -->
  <g filter="url(#soft)">
    <rect x="245" y="150" width="70" height="150" rx="14" fill="url(#bottle1)"/>
    <rect x="265" y="110" width="30" height="46" rx="6" fill="#3a2c30"/>
    <rect x="272" y="90" width="16" height="26" rx="4" fill="#2b2124"/>
  </g>

  <!-- bottle 2: gold shimmer -->
  <g filter="url(#soft)">
    <rect x="340" y="190" width="58" height="120" rx="12" fill="url(#bottle2)"/>
    <rect x="356" y="158" width="26" height="38" rx="6" fill="#3a2c30"/>
    <rect x="362" y="140" width="14" height="22" rx="3" fill="#2b2124"/>
  </g>

  <!-- bottle 3: cream/blush -->
  <g filter="url(#soft)">
    <rect x="170" y="210" width="58" height="110" rx="12" fill="url(#bottle3)"/>
    <rect x="186" y="180" width="26" height="34" rx="6" fill="#3a2c30"/>
    <rect x="192" y="164" width="14" height="20" rx="3" fill="#2b2124"/>
  </g>

  <!-- shade swatch dots -->
  <g>
    <circle cx="430" cy="380" r="16" fill="#d97ea0"/>
    <circle cx="465" cy="390" r="16" fill="#c9a24b"/>
    <circle cx="500" cy="378" r="16" fill="#3a2c30"/>
    <circle cx="395" cy="392" r="16" fill="#ffffff" stroke="#eab6c8" stroke-width="2"/>
  </g>
</svg>
