<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220">
  <rect width="560" height="220" rx="16" fill="#fbeee7"/>
  <text x="24" y="34" font-family="Georgia, serif" font-size="18" fill="#3a2c30" font-weight="700">Find Your Nail Size</text>

  <!-- 10 nail outlines with size labels, thumb to pinky x2 -->
  <g font-family="-apple-system, Arial, sans-serif" font-size="11" fill="#7a6a6f" text-anchor="middle">
    <!-- row of 10 nail shapes -->
    <g transform="translate(24,60)">
      <!-- sizes get progressively smaller from thumb (0) to pinky (4), mirrored for other hand -->
      <!-- Left hand: thumb..pinky -->
      <g transform="translate(0,0)">
        <rect x="0" y="0" width="34" height="46" rx="14" fill="#f0dca0" stroke="#c9a24b"/>
        <text x="17" y="62">Thumb</text>
        <text x="17" y="76" font-weight="700" fill="#3a2c30">Size 1</text>
      </g>
      <g transform="translate(50,6)">
        <rect x="0" y="0" width="28" height="40" rx="12" fill="#f7d9e3" stroke="#d97ea0"/>
        <text x="14" y="56">Index</text>
        <text x="14" y="70" font-weight="700" fill="#3a2c30">Size 2</text>
      </g>
      <g transform="translate(90,2)">
        <rect x="0" y="0" width="26" height="44" rx="12" fill="#f7d9e3" stroke="#d97ea0"/>
        <text x="13" y="60">Middle</text>
        <text x="13" y="74" font-weight="700" fill="#3a2c30">Size 3</text>
      </g>
      <g transform="translate(128,8)">
        <rect x="0" y="0" width="25" height="38" rx="11" fill="#f7d9e3" stroke="#d97ea0"/>
        <text x="12" y="54">Ring</text>
        <text x="12" y="68" font-weight="700" fill="#3a2c30">Size 4</text>
      </g>
      <g transform="translate(165,16)">
        <rect x="0" y="0" width="20" height="30" rx="9" fill="#f7d9e3" stroke="#d97ea0"/>
        <text x="10" y="46">Pinky</text>
        <text x="10" y="60" font-weight="700" fill="#3a2c30">Size 5</text>
      </g>
    </g>

    <g transform="translate(310,60)">
      <g transform="translate(0,0)">
        <rect x="0" y="0" width="34" height="46" rx="14" fill="#f0dca0" stroke="#c9a24b"/>
        <text x="17" y="62">Thumb</text>
        <text x="17" y="76" font-weight="700" fill="#3a2c30">Size 1</text>
      </g>
      <g transform="translate(50,6)">
        <rect x="0" y="0" width="28" height="40" rx="12" fill="#f7d9e3" stroke="#d97ea0"/>
        <text x="14" y="56">Index</text>
        <text x="14" y="70" font-weight="700" fill="#3a2c30">Size 2</text>
      </g>
      <g transform="translate(90,2)">
        <rect x="0" y="0" width="26" height="44" rx="12" fill="#f7d9e3" stroke="#d97ea0"/>
        <text x="13" y="60">Middle</text>
        <text x="13" y="74" font-weight="700" fill="#3a2c30">Size 3</text>
      </g>
      <g transform="translate(128,8)">
        <rect x="0" y="0" width="25" height="38" rx="11" fill="#f7d9e3" stroke="#d97ea0"/>
        <text x="12" y="54">Ring</text>
        <text x="12" y="68" font-weight="700" fill="#3a2c30">Size 4</text>
      </g>
      <g transform="translate(165,16)">
        <rect x="0" y="0" width="20" height="30" rx="9" fill="#f7d9e3" stroke="#d97ea0"/>
        <text x="10" y="46">Pinky</text>
        <text x="10" y="60" font-weight="700" fill="#3a2c30">Size 5</text>
      </g>
    </g>
  </g>

  <text x="24" y="200" font-family="-apple-system, Arial, sans-serif" font-size="11" fill="#7a6a6f">Left hand</text>
  <text x="310" y="200" font-family="-apple-system, Arial, sans-serif" font-size="11" fill="#7a6a6f">Right hand</text>
</svg>
