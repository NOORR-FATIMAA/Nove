<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist — Nove</title>
  <link rel="icon" type="image/png" href="/img/logo.png">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/index.html" class="logo"><img src="/img/logo.png" alt="Nove" class="logo-img"></a>
      <nav class="main-nav" id="mainNav">
        <a href="/index.html">Home</a>
        <a href="/products.html">Products</a>
        <a href="/about.html">About</a>
        <a href="/contact.html">Contact</a>
      </nav>
      <div class="header-actions">
        <a href="/wishlist.html" class="icon-link active" aria-label="Wishlist">&#9825;<span class="badge" id="wishlistCount">0</span></a>
        <a href="/cart.html" class="icon-link" aria-label="Cart">&#128717;<span class="badge" id="cartCount">0</span></a>
        <div id="themeToggle" class="theme-toggle"></div>
        <div id="authArea"></div>
        <button type="button" class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="mainNav">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <h1 class="section-title" style="text-align:left;">My Wishlist</h1>
      <div class="product-grid" id="wishlistGrid"></div>
      <div class="empty-state" id="wishlistEmptyState" style="display:none;">
        <h3>Your wishlist is empty</h3>
        <p>Save your favorite shades and sets for later.</p>
        <a href="/products.html" class="btn">Browse Products</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        &copy; 2026 Nove. All rights reserved.
        <div id="currencyControl" class="currency-control"></div>
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/storage.js"></script>
  <script src="/js/currency.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/products.js"></script>
  <script src="/js/wishlist.js"></script>
  <script src="/js/animations.js"></script>
</body>
</html>
