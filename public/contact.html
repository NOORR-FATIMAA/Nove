<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — Nove</title>
  <link rel="icon" type="image/png" href="/img/logo.png">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/index.html" class="logo"><img src="/img/logo.png" alt="Nove" class="logo-img"></a>
      <nav class="main-nav" id="mainNav">
        <a href="/index.html">Home</a>
        <a href="/products.html">Products</a>
        <a href="/about.html">About</a>
        <a href="/contact.html" class="active">Contact</a>
      </nav>
      <div class="header-actions">
        <a href="/wishlist.html" class="icon-link" aria-label="Wishlist">&#9825;<span class="badge" id="wishlistCount">0</span></a>
        <a href="/cart.html" class="icon-link" aria-label="Cart">&#128717;<span class="badge" id="cartCount">0</span></a>
        <div id="themeToggle" class="theme-toggle"></div>
        <div id="authArea"></div>
        <button type="button" class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="mainNav">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container contact-layout">
      <div>
        <h1>Get in Touch</h1>
        <p style="color:var(--ink-soft);">Questions about an order, a shade match, or a wholesale inquiry? We'd love to hear from you.</p>
        <div class="card" style="margin-top:24px;">
          <p><strong>Email:</strong> hello.nove.pk@gmail.com</p>
          <p><strong>Hours:</strong> Mon–Fri, 9am–5pm</p>
        </div>
      </div>

      <div class="card">
        <h3>Send a Message</h3>
        <div class="alert" id="contactAlert"></div>
        <form id="contactForm">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" required>
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>
          <button type="submit" class="btn btn-block">Send Message</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        &copy; 2026 Nove. All rights reserved.
        <div id="currencyControl" class="currency-control"></div>
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/storage.js"></script>
  <script src="/js/currency.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/animations.js"></script>
</body>
</html>
