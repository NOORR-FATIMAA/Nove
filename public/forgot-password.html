<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Nove</title>
  <link rel="icon" type="image/png" href="/img/logo.png">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
</head>
<body>
    <div id="promoBanner" class="promo-banner"></div>

  <header class="site-header" id="siteHeader">
    <div class="container header-inner">
      <button type="button" class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="mainNav">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>

      <a href="/index.html" class="logo"><img src="/img/logo.png" alt="Nove" class="logo-img"></a>

      <div class="header-actions">
        <form class="nav-search" id="navSearchForm">
          <input type="search" id="navSearchInput" placeholder="Search shades, sets...">
        </form>
        <a href="/orders.html" class="icon-link" aria-label="Track Order">&#128230;</a>
        <a href="/wishlist.html" class="icon-link" aria-label="Wishlist">&#9825;<span class="badge" id="wishlistCount">0</span></a>
        <a href="/cart.html" class="icon-link" aria-label="Cart">&#128717;<span class="badge" id="cartCount">0</span></a>
        <div id="themeToggle" class="theme-toggle"></div>
        <div id="authArea"></div>
      </div>
    </div>

    <div class="header-nav-row">
      <div class="container">
        <nav class="main-nav" id="mainNav">
          <a href="/index.html">Home</a>
          <a href="/products.html">Shop All</a>
          <div class="nav-dropdown" id="shopCategoryDropdown">
            <button type="button" class="nav-dropdown-trigger" id="shopCategoryTrigger" aria-expanded="false" aria-haspopup="true" aria-controls="navMegaMenu">
              Shop by Category <span class="nav-caret" aria-hidden="true">&#9662;</span>
            </button>
            <div class="nav-mega-menu" id="navMegaMenu"></div>
          </div>
          <a href="/products.html?sort=-createdAt">New Arrivals</a>
          <a href="/about.html">About</a>
          <a href="/contact.html">Contact</a>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <div class="form-card">
      <h2 style="text-align:center;">Reset Your Password</h2>
      <p style="text-align:center;color:var(--ink-soft);font-size:0.9rem;">Enter your email and we'll send you a link to reset your password.</p>
      <div class="alert" id="formAlert"></div>
      <form id="forgotForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <button type="submit" class="btn btn-block">Send Reset Link</button>
      </form>
      <p class="form-footer-link"><a href="/login.html">Back to log in</a></p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        &copy; 2026 Nove. All rights reserved.
        <div id="currencyControl" class="currency-control"></div>
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/storage.js"></script>
  <script src="/js/currency.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/home-content.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/animations.js"></script>
</body>
</html>
