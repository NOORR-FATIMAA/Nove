<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bundle — Nove</title>
  <link rel="icon" type="image/png" href="/img/logo.png">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/index.html" class="logo"><img src="/img/logo.png" alt="Nove" class="logo-img"></a>
      <nav class="main-nav" id="mainNav">
        <a href="/index.html">Home</a>
        <a href="/products.html">Products</a>
        <a href="/about.html">About</a>
        <a href="/contact.html">Contact</a>
      </nav>
      <div class="header-actions">
        <a href="/wishlist.html" class="icon-link" aria-label="Wishlist">&#9825;<span class="badge" id="wishlistCount">0</span></a>
        <a href="/cart.html" class="icon-link" aria-label="Cart">&#128717;<span class="badge" id="cartCount">0</span></a>
        <div id="themeToggle" class="theme-toggle"></div>
        <div id="authArea"></div>
        <button type="button" class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="mainNav">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container" id="bundleDetailRoot">
      <div class="product-detail">
        <div class="gallery">
          <div class="gallery-main">
            <img id="bundleMainImg" src="" alt="">
          </div>
        </div>

        <div class="detail-info">
          <span class="cat-label">Curated Set</span>
          <h1 id="bundleName"></h1>

          <div class="detail-price">
            <span id="bundlePrice"></span>
            <span class="price-strike" id="bundleSeparateTotal"></span>
          </div>
          <p style="color:var(--success);font-weight:600;font-size:0.9rem;" id="bundleSavings"></p>

          <p id="bundleDescription"></p>

          <h3 style="margin-top:24px;">What's Included</h3>
          <div id="bundleItemsList"></div>

          <button type="button" class="btn" id="addBundleToCartBtn" style="margin-top:20px;">Add All to Cart</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        &copy; 2026 Nove. All rights reserved.
        <div id="currencyControl" class="currency-control"></div>
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/storage.js"></script>
  <script src="/js/currency.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/bundles.js"></script>
  <script src="/js/animations.js"></script>
</body>
</html>
