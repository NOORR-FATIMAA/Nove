<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Nove</title>
  <link rel="icon" type="image/png" href="/img/logo.png">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <main>
    <div class="form-card">
      <div id="themeToggle" class="theme-toggle" style="display:flex;justify-content:flex-end;margin-bottom:8px;"></div>
      <img src="/img/logo.png" alt="Nove" style="height:40px;display:block;margin:0 auto 14px;">
      <h2 style="text-align:center;">Admin Login</h2>
      <div class="alert" id="formAlert"></div>
      <form id="adminLoginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-block">Log In</button>
      </form>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/admin/js/admin-login.js"></script>
</body>
</html>
